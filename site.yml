---
- name: Full deployment — base setup, services, and startup
  hosts: all
  gather_facts: true
  roles:
    - base_setup
  post_tasks:
    - name: Deploy each service role
      ansible.builtin.include_role:
        name: "{{ svc.role }}"
      vars:
        service_name: "{{ svc.name }}"
        service_user: "{{ svc.name }}"
        service_home: "{{ base_setup_services_dir }}/{{ svc.name }}"
        service_repo: "{{ base_setup_services_path }}/service-{{ svc.repo }}"
      loop: "{{ base_setup_all_services }}"
      loop_control:
        loop_var: svc
