---
- name: Let run0 work without a terminal
  hosts: all
  gather_facts: false
  become_method: community.general.run0
  vars:
    ansible_ssh_extra_args: -o RequestTTY=yes
  pre_tasks:
    - name: Ensure the local policy directory exists
      ansible.builtin.file:
        path: /etc/selinux/local
        state: directory
        owner: root
        mode: '0755'
  roles:
    - run0_pipe_policy

- name: Full deployment — base setup, services, and startup
  hosts: all
  gather_facts: true
  roles:
    - base_setup
  post_tasks:
    - name: Deploy each service role
      ansible.builtin.include_role:
        name: "{{ svc.role }}"
      vars:
        service_name: "{{ svc.name }}"
        service_user: "{{ svc.name }}"
        service_home: "{{ base_setup_services_dir }}/{{ svc.name }}"
        service_repo: "{{ base_setup_services_path }}/service-{{ svc.repo }}"
      loop: "{{ base_setup_all_services }}"
      loop_control:
        loop_var: svc
