---
# SecureBlue Deployment Playbook

- name: Base system setup (Btrfs, Users, SELinux, Snapshots)
  hosts: all
  gather_facts: true
  roles:
    - base_setup

- name: Deploy Nextcloud service
  hosts: all
  gather_facts: false
  vars:
    nextcloud_service_user: nextcloud
    nextcloud_service_uid: "{{ nextcloud_uid | default(82) }}"
    nextcloud_service_home: /var/services/nextcloud
    nextcloud_service_role_dir: "{{ playbook_dir }}/../service-nextcloud/ansible-role/nextcloud_service"
    nextcloud_service_quadlet_dir: "{{ playbook_dir }}/../service-nextcloud/quadlets"
  roles:
    - role: nextcloud_service
  post_tasks:
    - name: Deploy Nextcloud static Quadlet files (volume, network, pod)
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/nextcloud/.config/containers/systemd/"
        owner: nextcloud
        group: nextcloud
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-app-apps.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-app-config.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-app-html.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-app-logs.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-db.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-web-cache.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nextcloud-data.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/shared-network.network"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc.pod"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/nc-app-data.volume"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/promtail-nc.container"
        - "{{ playbook_dir }}/../service-nextcloud/quadlets/promtail-nc.pod"

    - name: Template Nextcloud container Quadlet files from .container.j2
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../service-nextcloud/quadlets/{{ item }}.container.j2"
        dest: "/var/services/nextcloud/.config/containers/systemd/{{ item }}.container"
        owner: nextcloud
        group: nextcloud
        mode: "0644"
      loop:
        - nextcloud-db
        - nextcloud-redis
        - nextcloud-app
        - nextcloud-web
        - nextcloud-cron
        - nextcloud-push
        - nextcloud-preview-generator

    - name: Ensure configs directory exists
      ansible.builtin.file:
        path: "/var/services/nextcloud/.config/containers/systemd/configs"
        state: directory
        owner: nextcloud
        group: nextcloud
        mode: "0755"

    - name: Template Nextcloud nginx config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../service-nextcloud/quadlets/configs/nginx.conf.j2"
        dest: "/var/services/nextcloud/.config/containers/systemd/configs/nginx.conf"
        owner: nextcloud
        group: nextcloud
        mode: "0644"

    - name: Deploy Nextcloud promtail config
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../service-nextcloud/quadlets/configs/promtail-nc.yaml"
        dest: "/var/services/nextcloud/.config/containers/systemd/configs/promtail-nc.yaml"
        owner: nextcloud
        group: nextcloud
        mode: "0644"

    - name: Template Nextcloud environment file (secrets)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../service-nextcloud/ansible-role/nextcloud_service/templates/nextcloud.env.j2"
        dest: "/var/services/nextcloud/.config/containers/systemd/configs/nextcloud.env"
        owner: nextcloud
        group: nextcloud
        mode: "0600"

- name: Deploy Bunkerweb service
  hosts: all
  gather_facts: false
  vars:
    bunker_service_user: proxy
    bunker_service_uid: "{{ proxy_uid | default(1001) }}"
    bunker_service_home: /var/services/proxy
    bunker_service_role_dir: "{{ playbook_dir }}/../service-bunker/ansible-role/bunker_service"
    bunker_service_quadlet_dir: "{{ playbook_dir }}/../service-bunker/quadlets"
  roles:
    - role: bunker_service
  post_tasks:
    - name: Deploy Bunkerweb Quadlet files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/proxy/.config/containers/systemd/"
        owner: proxy
        group: proxy
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-bunker/quadlets/bunker-nginx.container"
        - "{{ playbook_dir }}/../service-bunker/quadlets/bunker-scheduler.container"
        - "{{ playbook_dir }}/../service-bunker/quadlets/bw-data.volume"
        - "{{ playbook_dir }}/../service-bunker/quadlets/bw-nginx-data.volume"
        - "{{ playbook_dir }}/../service-bunker/quadlets/shared-network.network"
        - "{{ playbook_dir }}/../service-bunker/quadlets/proxy.pod"
        - "{{ playbook_dir }}/../service-bunker/quadlets/promtail-proxy.pod"
        - "{{ playbook_dir }}/../service-bunker/quadlets/promtail-proxy.container"

    - name: Ensure configs directory exists for bunker
      ansible.builtin.file:
        path: "/var/services/proxy/.config/containers/systemd/configs"
        state: directory
        owner: proxy
        group: proxy
        mode: "0755"

    - name: Deploy Bunkerweb config files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/proxy/.config/containers/systemd/configs/"
        owner: proxy
        group: proxy
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-bunker/quadlets/configs/promtail-proxy.yaml"
        - "{{ playbook_dir }}/../service-bunker/quadlets/configs/json_analytics.conf"

- name: Deploy Monitoring service
  hosts: all
  gather_facts: false
  vars:
    monitoring_service_user: monitoring
    monitoring_service_uid: "{{ monitoring_uid | default(1002) }}"
    monitoring_service_home: /var/services/monitoring
    monitoring_service_role_dir: "{{ playbook_dir }}/../service-monitoring/ansible-role/monitoring_service"
  roles:
    - role: monitoring_service
  post_tasks:
    - name: Deploy Monitoring Quadlet files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/monitoring/.config/containers/systemd/"
        owner: monitoring
        group: monitoring
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring.pod"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring-grafana.container"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring-loki.container"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring-node-exporter.container"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring-prometheus.container"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/monitoring-promtail.container"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/grafana-data.volume"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/loki-data.volume"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/prometheus-data.volume"

    - name: Ensure configs directory exists for monitoring
      ansible.builtin.file:
        path: "/var/services/monitoring/.config/containers/systemd/configs"
        state: directory
        owner: monitoring
        group: monitoring
        mode: "0755"

    - name: Ensure dashboards directory exists for monitoring
      ansible.builtin.file:
        path: "/var/services/monitoring/.config/containers/systemd/configs/dashboards"
        state: directory
        owner: monitoring
        group: monitoring
        mode: "0755"

    - name: Deploy Monitoring config files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/monitoring/.config/containers/systemd/configs/"
        owner: monitoring
        group: monitoring
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/loki.yaml"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/prometheus.yaml"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/prometheus-rules.yaml"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/promtail.yaml"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/grafana-datasources.yaml"
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/grafana-dashboards.yaml"

    - name: Deploy Monitoring dashboard JSON files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/var/services/monitoring/.config/containers/systemd/configs/dashboards/"
        owner: monitoring
        group: monitoring
        mode: "0644"
      loop:
        - "{{ playbook_dir }}/../service-monitoring/quadlets/configs/dashboards/node-exporter.json"

- name: Reload service users and start Quadlet containers
  hosts: all
  gather_facts: false
  tasks:
    - name: Reload systemd user daemons for all service users
      ansible.builtin.command:
        cmd: "machinectl shell {{ item }}@ /usr/bin/systemctl --user daemon-reload"
      loop:
        - nextcloud
        - proxy
        - monitoring
      changed_when: true
      failed_when: false

    - name: Restart user@.service for service users (triggers Quadlet generator)
      ansible.builtin.systemd:
        name: "user@{{ item.uid }}.service"
        state: restarted
        scope: system
      loop:
        - { name: nextcloud, uid: "{{ nextcloud_uid | default(82) }}" }
        - { name: proxy, uid: "{{ proxy_uid | default(1001) }}" }
        - { name: monitoring, uid: "{{ monitoring_uid | default(1002) }}" }
      failed_when: false
