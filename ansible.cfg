[defaults]
become_plugins = ./plugins/become
# Per-task timings, so deployment slowness is measured and not guessed.
callbacks_enabled = ansible.posix.profile_tasks
host_key_checking = False
pipelining = True
roles_path = ./roles:../service-nextcloud/ansible-role:../service-bunker/ansible-role:../service-monitoring/ansible-role

[privilege_escalation]
become = True
become_method = run0_pipe

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=4h
control_path = /tmp/ansible-%%h-%%p-%%r
