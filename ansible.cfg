[defaults]
host_key_checking = False
pipelining = False
roles_path = ./roles

[privilege_escalation]
become = True
become_method = community.general.run0

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o RequestTTY=yes -o IdentityFile=/workspace/ansible-base/test/coreos_key -o ControlMaster=auto -o ControlPersist=60s
control_path = /tmp/ansible-%%h-%%p-%%r
