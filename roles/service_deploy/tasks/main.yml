---
- name: Ensure target user home directories exist
  ansible.builtin.file:
    path: "{{ item.home }}/.config/systemd/user"
    state: directory
    owner: "{{ item.user }}"
    mode: "0755"
  loop: "{{ base_setup_service_deploy_targets }}"

- name: Deploy Quadlet containers
  ansible.builtin.copy:
    src: "{{ item.containers_dir }}/"
    dest: "{{ item.home }}/.config/systemd/user/"
    owner: "{{ item.user }}"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ base_setup_service_deploy_targets }}"

- name: Deploy Quadlet volumes
  ansible.builtin.copy:
    src: "{{ item.volumes_dir }}/"
    dest: "{{ item.home }}/.config/systemd/user/"
    owner: "{{ item.user }}"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ base_setup_service_deploy_targets }}"

- name: Deploy Quadlet networks
  ansible.builtin.copy:
    src: "{{ item.networks_dir }}/"
    dest: "{{ item.home }}/.config/systemd/user/"
    owner: "{{ item.user }}"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ base_setup_service_deploy_targets }}"

- name: Deploy configs (Nextcloud-specific)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.home }}/.config/systemd/user/{{ item.dst }}"
    owner: "{{ item.user }}"
    mode: "0644"
    directory_mode: "0755"
  loop: "{{ base_setup_nextcloud_configs }}"
  when: item.user == "nextcloud"

# Skip daemon-reload for now — Quadlet files are copied, user can run systemctl --user daemon-reload manually
# - name: Reload user systemd daemon
#   ansible.builtin.command: "systemctl --user daemon-reload"
#   loop: "{{ base_setup_service_deploy_targets }}"
#   loop_control:
#     loop_var: target
#   changed_when: true

- name: Notify user to reload systemd
  ansible.builtin.debug:
    msg: "Quadlet files deployed. Run 'run0 systemctl --user daemon-reload --machine={{ target.user }}@' to activate services."
  loop: "{{ base_setup_service_deploy_targets }}"
  loop_control:
    loop_var: target
