---
# Ignition creates /var as Btrfs partition
# Ansible creates subvolumes under /var/services/

- name: Ensure /var/services directory exists
  ansible.builtin.file:
    path: /var/services
    state: directory
    mode: "0755"

- name: Create Btrfs subvolumes under /var/services
  ansible.builtin.command: "btrfs subvolume create /var/services/{{ item }}"
  loop:
    - nextcloud
    - proxy
    - monitoring
    - snapshots
  args:
    creates: "/var/services/{{ item }}"
  changed_when: true

- name: Create service users (non-login, system)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    home: "{{ item.home }}"
    shell: /usr/sbin/nologin
    createhome: false
    system: true
  loop: "{{ base_setup_bmc_users }}"

- name: Add subuid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ item.name }}:{{ item.subuid_start }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.name }}:"
    create: true
    mode: "0644"
  loop: "{{ base_setup_bmc_users }}"

- name: Add subgid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ item.name }}:{{ item.subuid_start }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.name }}:"
    create: true
    mode: "0644"
  loop: "{{ base_setup_bmc_users }}"

- name: Set subvolume ownership
  ansible.builtin.file:
    path: "/var/services/{{ item.path }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    state: directory
    mode: "0750"
  loop:
    - { path: nextcloud, owner: nextcloud }
    - { path: proxy, owner: proxy }
    - { path: monitoring, owner: monitoring }

- name: Ensure Quadlet systemd directory exists
  ansible.builtin.file:
    path: "/var/services/{{ item.name }}/.config/containers/systemd"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0755"
  loop: "{{ base_setup_bmc_users }}"

- name: Install SELinux file context rules
  community.general.sefcontext:
    target: "{{ item }}"
    setype: container_file_t
    state: present
  loop:
    - "/var/services/nextcloud(/.*)?"
    - "/var/services/proxy(/.*)?"
    - "/var/services/monitoring(/.*)?"
    - "/var/services/snapshots(/.*)?"
    - "/var/services(/.*)?"

- name: Apply SELinux labels
  ansible.builtin.command: "restorecon -Rv {{ item }}"
  loop:
    - /var/services/nextcloud
    - /var/services/proxy
    - /var/services/monitoring
    - /var/services/snapshots
    - /var/services
  changed_when: true

- name: Deploy snapshot service template
  ansible.builtin.template:
    src: btrfs-snapshot@.service.j2
    dest: "/etc/systemd/system/btrfs-snapshot@.service"
    mode: "0644"
  notify: Restart snapshot services

- name: Deploy snapshot timer template
  ansible.builtin.template:
    src: btrfs-snapshot@.timer.j2
    dest: "/etc/systemd/system/btrfs-snapshot@.timer"
    mode: "0644"
  notify: Restart snapshot services

- name: Deploy snapshot cleanup script
  ansible.builtin.copy:
    src: btrfs-snapshot-cleanup.sh
    dest: /usr/local/bin/btrfs-snapshot-cleanup.sh
    mode: "0755"

- name: Enable and start snapshot timers
  ansible.builtin.systemd:
    name: "btrfs-snapshot@{{ item }}.timer"
    enabled: true
    state: started
  loop:
    - nextcloud
    - proxy
    - monitoring

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
