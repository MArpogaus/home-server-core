---
# Ignition creates /var as Btrfs partition
# Ansible creates subvolumes under /var/services/

- name: Ensure /var/services directory exists
  ansible.builtin.file:
    path: /var/services
    state: directory
    mode: '0755'

- name: Create Btrfs subvolumes for each service
  ansible.builtin.command:
    cmd: "btrfs subvolume create /var/services/{{ item.name }}"
    creates: "/var/services/{{ item.name }}"
  loop: "{{ base_setup_services }}"
  changed_when: true

- name: Create Btrfs subvolume for snapshots
  ansible.builtin.command:
    cmd: "btrfs subvolume create {{ base_setup_btrfs_snapshot_dir }}"
    creates: "{{ base_setup_btrfs_snapshot_dir }}"
  changed_when: true

- name: Create service users (non-login, system)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    home: "/var/services/{{ item.name }}"
    shell: /usr/sbin/nologin
    createhome: false
    system: true
  loop: "{{ base_setup_services }}"

- name: Add subuid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ item.0.name }}:{{ 100000 + item.1 * (base_setup_subuid_range_size | int) }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.0.name }}:"
    create: true
    mode: '0644'
  loop: "{{ base_setup_services | zip(range(base_setup_services | length)) | list }}"

- name: Add subgid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ item.0.name }}:{{ 100000 + item.1 * (base_setup_subuid_range_size | int) }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.0.name }}:"
    create: true
    mode: '0644'
  loop: "{{ base_setup_services | zip(range(base_setup_services | length)) | list }}"

- name: Set subvolume ownership
  ansible.builtin.file:
    path: "/var/services/{{ item.name }}"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    state: directory
    mode: '0750'
  loop: "{{ base_setup_services }}"

- name: Ensure Quadlet systemd directory exists
  ansible.builtin.file:
    path: "/var/services/{{ item.name }}/.config/containers/systemd"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0755'
  loop: "{{ base_setup_services }}"

- name: Build SELinux file context targets
  ansible.builtin.set_fact:
    base_setup_selinux_targets: >-
      {{
        ['/var/services/snapshots(/.*)?', '/var/services(/.*)?']
        + (base_setup_services | map(attribute='name')
           | map('regex_replace', '^(.*)$', '/var/services/\\1(/.*)?') | list)
      }}

- name: Install SELinux file context rules
  community.general.sefcontext:
    target: "{{ item }}"
    setype: container_file_t
    state: present
  loop: "{{ base_setup_selinux_targets }}"

- name: Apply SELinux labels
  ansible.builtin.command:
    cmd: "restorecon -Rv /var/services/{{ item.name }}"
  loop: "{{ base_setup_services }}"
  changed_when: true

- name: Ensure containers config directory exists for each service user
  ansible.builtin.file:
    path: "/var/services/{{ item.name }}/.config/containers"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: '0755'
  loop: "{{ base_setup_services }}"

- name: Deploy sigstore config for ghcr.io/marpogaus (cosign signature lookup)
  ansible.builtin.copy:
    dest: /etc/containers/registries.d/ghcr.io-marpogaus.yaml
    content: |
      docker:
        ghcr.io/marpogaus:
          use-sigstore-attachments: true
    mode: '0644'

- name: Deploy snapshot service template
  ansible.builtin.template:
    src: btrfs-snapshot@.service.j2
    dest: /etc/systemd/system/btrfs-snapshot@.service
    mode: '0644'
  notify: Restart snapshot services

- name: Deploy snapshot timer template
  ansible.builtin.template:
    src: btrfs-snapshot@.timer.j2
    dest: /etc/systemd/system/btrfs-snapshot@.timer
    mode: '0644'
  notify: Restart snapshot services

- name: Deploy snapshot cleanup script
  ansible.builtin.copy:
    src: btrfs-snapshot-cleanup.sh
    dest: /usr/local/bin/btrfs-snapshot-cleanup.sh
    mode: '0755'

- name: Enable and start snapshot timers for each service
  ansible.builtin.systemd:
    name: "btrfs-snapshot@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ base_setup_services }}"

- name: Enable linger for service users (persistent systemd user managers)
  ansible.builtin.command: "loginctl enable-linger {{ item.name }}"
  loop: "{{ base_setup_services }}"
  changed_when: true

- name: Start systemd user managers for service users (activate user bus)
  ansible.builtin.systemd:
    name: "user@{{ item.uid }}.service"
    state: started
    scope: system
  loop: "{{ base_setup_services }}"

- name: Create shared Podman network for each service user
  ansible.builtin.command:
    cmd: "podman network create --driver bridge --subnet 10.89.0.0/24 shared-network"
  become: true
  become_user: "{{ item.name }}"
  loop: "{{ base_setup_services }}"
  changed_when: false
  failed_when: false

- name: Deploy auto-reboot script for staged rpm-ostree deployments
  ansible.builtin.copy:
    src: auto-reboot-staged.sh
    dest: /usr/local/bin/auto-reboot-staged.sh
    mode: '0755'

- name: Deploy auto-reboot systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - auto-reboot-staged.service
    - auto-reboot-staged.timer

- name: Enable and start auto-reboot timer
  ansible.builtin.systemd:
    name: auto-reboot-staged.timer
    enabled: true
    state: started

- name: Enable podman auto-update timer for service users
  ansible.builtin.command:
    cmd: "machinectl shell {{ item.name }}@ /usr/bin/systemctl --user enable --now podman-auto-update.timer"
  loop: "{{ base_setup_services }}"
  register: base_setup_auto_update_enable
  changed_when: "'Created symlink' in base_setup_auto_update_enable.stdout"
  failed_when: false

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: Configure firewall to allow SSH, HTTP, and HTTPS only
  ansible.builtin.command:
    cmd: "firewall-cmd --permanent --add-service={{ item }}"
  loop:
    - ssh
    - http
    - https
  register: base_setup_firewall_add
  changed_when: "'already' not in base_setup_firewall_add.stderr"
  failed_when: false

- name: Reload firewall to apply permanent rules
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: true
  failed_when: false

- name: Allow unprivileged users to bind to ports >= 80 (for rootless Podman)
  ansible.builtin.copy:
    content: |
      # Allow rootless Podman to publish ports >= 80
      net.ipv4.ip_unprivileged_port_start=80
    dest: /etc/sysctl.d/90-unprivileged-port-start.conf
    mode: '0644'
  register: base_setup_sysctl_config
  notify: Apply sysctl setting

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
