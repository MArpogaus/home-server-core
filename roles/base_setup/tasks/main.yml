---

- name: Merge built-in and extra service definitions
  ansible.builtin.set_fact:
    base_setup_all_services: "{{ base_setup_services + base_setup_extra_services }}"

- name: Ensure services root directory exists
  ansible.builtin.file:
    path: "{{ base_setup_services_dir }}"
    state: directory
    mode: "0755"

# `creates:` alone is not enough: the command module still returns rc 0 with a
# "Did not run command" message, so a blanket changed_when reports a change on
# every run. Select the missing ones instead, then changed_when is honest.
- name: Check which Btrfs subvolumes exist
  ansible.builtin.stat:
    path: "{{ base_setup_services_dir }}/{{ item.name }}"
  loop: "{{ base_setup_all_services }}"
  loop_control:
    label: "{{ item.name }}"
  register: base_setup_subvol_stat

- name: Create the missing Btrfs subvolumes
  ansible.builtin.command:
    cmd: btrfs subvolume create {{ base_setup_services_dir }}/{{ item.item.name }}
  loop: "{{ base_setup_subvol_stat.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: base_setup_subvol_created
  changed_when: true

- name: Create Btrfs subvolume for snapshots
  ansible.builtin.command:
    cmd: btrfs subvolume create {{ base_setup_btrfs_snapshot_dir }}
    creates: "{{ base_setup_btrfs_snapshot_dir }}"
  register: base_setup_snapshot_subvol
  changed_when: "'Did not run command' not in base_setup_snapshot_subvol.msg"

- name: Create service users (non-login, system)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    home: "{{ base_setup_services_dir }}/{{ item.name }}"
    shell: /usr/sbin/nologin
    createhome: false
    system: true
    groups: "{{ item.groups | default([]) }}"
    append: true
  loop: "{{ base_setup_all_services }}"

- name: Add subuid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "{{ item.name }}:{{ base_setup_subuid_start }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.name }}:"
    create: true
    mode: "0644"
  loop: "{{ base_setup_all_services }}"

- name: Add subgid entries for rootless podman
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "{{ item.name }}:{{ base_setup_subuid_start }}:{{ base_setup_subuid_range_size }}"
    regexp: "^{{ item.name }}:"
    create: true
    mode: "0644"
  loop: "{{ base_setup_all_services }}"

- name: Set subvolume ownership
  ansible.builtin.file:
    path: "{{ base_setup_services_dir }}/{{ item.name }}"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    state: directory
    mode: "0750"
  loop: "{{ base_setup_all_services }}"

- name: Ensure Quadlet systemd directory exists
  ansible.builtin.file:
    path: "{{ base_setup_services_dir }}/{{ item.name }}/.config/containers/systemd"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0755"
  loop: "{{ base_setup_all_services }}"

# SecureBlue installs the harden_container_userns SELinux module, which denies
# container_runtime_t the creation of a user namespace. Rootless Podman cannot
# work without one: every podman command fails with "cannot clone: Permission
# denied". `ujust` owns the module, so it does the toggling.
- name: Read whether container domains may create user namespaces
  ansible.builtin.command: ujust set-container-userns status
  register: base_setup_container_userns
  changed_when: false

- name: Allow container domains to create user namespaces
  ansible.builtin.command: ujust set-container-userns on
  when: "'disabled' in base_setup_container_userns.stdout"
  changed_when: true

- name: Build SELinux file context targets
  ansible.builtin.set_fact:
    base_setup_selinux_targets:
      - "{{ base_setup_services_dir }}(/.*)?"

- name: Install SELinux file context rules
  community.general.sefcontext:
    target: "{{ item }}"
    setype: container_file_t
    state: present
  loop: "{{ base_setup_selinux_targets }}"

- name: Read the SELinux type of the service directories
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ [base_setup_services_dir] + base_setup_all_services
            | map(attribute='name')
            | map('regex_replace', '^', base_setup_services_dir ~ '/')
            | list }}"
  register: base_setup_selinux_stat

# The label itself decides. Ignition creates the subvolumes, so on a fresh host
# neither the rule nor the subvolume is new, and a guard on those two never
# fires. `restorecon -R` walks the whole tree, which is the entire Nextcloud
# data directory on a real host, so it runs only where the type is wrong.
- name: Apply SELinux labels
  ansible.builtin.command:
    cmd: restorecon -Rv {{ item.item }}
  loop: "{{ base_setup_selinux_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.stat.exists
    - item.stat.secontext | default('') is not search(':container_file_t:')
  changed_when: true

- name: Deploy snapshot service template
  ansible.builtin.template:
    src: btrfs-snapshot@.service.j2
    dest: /etc/systemd/system/btrfs-snapshot@.service
    mode: "0644"

- name: Deploy snapshot timer template
  ansible.builtin.template:
    src: btrfs-snapshot@.timer.j2
    dest: /etc/systemd/system/btrfs-snapshot@.timer
    mode: "0644"

- name: Deploy snapshot cleanup script
  ansible.builtin.copy:
    src: btrfs-snapshot-cleanup.sh
    dest: /usr/local/bin/btrfs-snapshot-cleanup.sh
    mode: "0755"

# daemon_reload here, not at the end: a first run enables a brand-new unit.
- name: Enable and start snapshot timers for each service
  ansible.builtin.systemd:
    name: btrfs-snapshot@{{ item.name }}.timer
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ base_setup_all_services }}"

- name: Enable linger for service users (persistent systemd user managers)
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ item.name }}
    creates: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ base_setup_all_services }}"

- name: Start systemd user managers for service users (activate user bus)
  ansible.builtin.systemd:
    name: user@{{ item.uid }}.service
    state: started
    scope: system
  loop: "{{ base_setup_all_services }}"

- name: Deploy auto-reboot script for staged rpm-ostree deployments
  ansible.builtin.copy:
    src: auto-reboot-staged.sh
    dest: /usr/local/bin/auto-reboot-staged.sh
    mode: "0755"

- name: Deploy auto-reboot systemd service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop:
    - auto-reboot-staged.service
    - auto-reboot-staged.timer

- name: Enable and start auto-reboot timer
  ansible.builtin.systemd:
    name: auto-reboot-staged.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable podman auto-update timer for service users
  ansible.builtin.command: # noqa: command-instead-of-module
    cmd: systemctl --user -M {{ item.name }}@ enable --now podman-auto-update.timer
  loop: "{{ base_setup_all_services }}"
  register: base_setup_auto_update_enable
  changed_when: "'Created symlink' in base_setup_auto_update_enable.stderr"

- name: Ensure firewalld is running
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

# No `firewall-cmd --reload`: it rebuilds the nftables ruleset and wedges the
# SSH connection that Ansible runs over. This module needs no reload.
- name: Configure firewall to allow SSH, HTTP, and HTTPS only
  ansible.posix.firewalld:
    service: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop: "{{ base_setup_firewall_services }}"

- name: Allow unprivileged users to bind to ports >= 80 (for rootless Podman)
  ansible.builtin.copy:
    content: |
      # Allow rootless Podman to publish ports >= 80
      net.ipv4.ip_unprivileged_port_start=80
    dest: /etc/sysctl.d/90-unprivileged-port-start.conf
    mode: "0644"
  notify: Apply sysctl setting

- name: Enable swap on zram
  ansible.builtin.copy:
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"
    content: |
      [zram0]
      zram-size = min(ram / 2, 4096)
      compression-algorithm = zstd
  notify: Start zram swap

- name: Set up the iSCSI backup target
  ansible.builtin.include_tasks: backup_target.yml
  when: base_setup_iscsi_portal | length > 0

- name: Deploy off-box backup script
  ansible.builtin.copy:
    src: btrfs-backup.sh
    dest: /usr/local/bin/btrfs-backup.sh
    mode: "0755"

- name: Ensure the LUKS key directory exists
  ansible.builtin.file:
    path: "{{ base_setup_luks_keyfile | dirname }}"
    state: directory
    owner: root
    mode: '0700'
  when: base_setup_backup_targets | length > 0

- name: Install the LUKS key file
  ansible.builtin.copy:
    content: "{{ base_setup_luks_passphrase }}"
    dest: "{{ base_setup_luks_keyfile }}"
    owner: root
    mode: '0400'
  when: base_setup_backup_targets | length > 0
  no_log: true

- name: Ensure the backup target directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - /etc/btrfs-backup
    - "{{ base_setup_backup_root }}"

- name: Write a config file per backup target
  ansible.builtin.template:
    src: backup-target.conf.j2
    dest: "/etc/btrfs-backup/{{ item.name }}.conf"
    owner: root
    mode: "0600"
  loop: "{{ base_setup_backup_targets }}"
  loop_control:
    label: "{{ item.name }}"

# Found by UUID, so the entry survives a re-plug on a different port. systemd
# opens the container when the device appears; nofail keeps a missing disk from
# holding up the boot.
- name: Register each backup target in crypttab
  ansible.builtin.lineinfile:
    path: /etc/crypttab
    regexp: "^backup-{{ item.name }}\\s"
    line: >-
      backup-{{ item.name }} UUID={{ item.uuid }}
      {{ base_setup_luks_keyfile }} luks,_netdev,nofail
    create: true
    owner: root
    mode: "0600"
  loop: "{{ base_setup_backup_targets }}"
  loop_control:
    label: "{{ item.name }}"

# systemd generates the .mount and the .automount from this, so there is
# nothing to template and nothing to enable. btrfs-backup@ pulls the mount in
# when it runs, through RequiresMountsFor.
- name: Mount each target on demand
  ansible.posix.mount:
    path: "{{ base_setup_backup_root }}/{{ item.name }}"
    src: "/dev/mapper/backup-{{ item.name }}"
    fstype: btrfs
    opts: noauto,nofail,noatime,x-systemd.automount,x-systemd.idle-timeout=300
    state: present
  loop: "{{ base_setup_backup_targets }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd for crypttab

- name: Deploy the backup service template
  ansible.builtin.template:
    src: btrfs-backup@.service.j2
    dest: /etc/systemd/system/btrfs-backup@.service
    owner: root
    mode: "0644"
  notify: Reload systemd for crypttab
