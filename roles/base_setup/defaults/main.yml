---
# Service users (non-login accounts for containerized services)
# UIDs can be overridden in deployment-private/secrets/vars.yml
# Subuid/subgid range size for rootless podman
base_setup_subuid_range_size: 65536

base_setup_bmc_users:
  - name: nextcloud
    uid: "{{ nextcloud_uid | default(82) }}"
    home: /var/services/nextcloud
    subuid_start: 100000
  - name: proxy
    uid: "{{ proxy_uid | default(1001) }}"
    home: /var/services/proxy
    subuid_start: "{{ 100000 + base_setup_subuid_range_size | int }}"
  - name: monitoring
    uid: "{{ monitoring_uid | default(1002) }}"
    home: /var/services/monitoring
    subuid_start: "{{ 100000 + 2 * base_setup_subuid_range_size | int }}"

# Snapshot settings
base_setup_btrfs_snapshot_dir: /var/services/snapshots
base_setup_btrfs_snapshot_retention_days: 30
base_setup_btrfs_snapshot_schedule: "daily"
